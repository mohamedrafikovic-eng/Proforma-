<!doctype html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Facture proforma</title>
<script src="html2canvas.min.js"></script>
<script src="jspdf.umd.min.js"></script>
<style>
:root{--bg:#F5F5F0;--card:#fff;--ink:#17233B;--mut:#58627A;--line:#DCDDD6;--a:#1D3E7A;--onA:#fff;--red:#B03A0A;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151F;--card:#19212F;--ink:#E7ECF6;--mut:#9DA9C2;--line:#2B3548;--a:#6E9BEA;--onA:#0B1220;--red:#F08A5D}}
:root[data-theme="dark"]{--bg:#10151F;--card:#19212F;--ink:#E7ECF6;--mut:#9DA9C2;--line:#2B3548;--a:#6E9BEA;--onA:#0B1220;--red:#F08A5D}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Tajawal',system-ui,sans-serif}
.app{max-width:520px;margin:0 auto;padding:20px 16px 40px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:22px}h2{margin:0 0 10px;font-size:16px}
.card{background:var(--card);border-radius:14px;padding:14px}
.m{color:var(--mut);font-size:13px}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px}
.g{display:grid;gap:10px}.g2{grid-template-columns:1fr 1fr}
label{display:block;color:var(--mut);font-size:13px}
input,textarea{font:inherit;color:var(--ink);width:100%;min-height:46px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);margin-top:4px}
textarea{min-height:60px;resize:vertical}
button{font:inherit;color:var(--ink);cursor:pointer}
.btn{background:var(--a);color:var(--onA);border:0;border-radius:12px;min-height:50px;font-weight:700;width:100%}
.sec{background:var(--card);border:1px solid var(--line);border-radius:12px;min-height:46px;width:100%}
.x{background:none;border:0;color:var(--red);min-width:44px;min-height:44px;font-size:18px}
.it{border-bottom:1px solid var(--line);padding:10px 0;display:grid;gap:8px}.it:last-child{border:0}
.tot b{font-size:20px}
#wrap{transform-origin:top left}
.sheetbox{overflow:hidden;border-radius:6px;border:1px solid var(--line);background:#fff}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="app">
<section id="edit" class="app" style="padding:0">
<div class="r"><h1>Facture proforma</h1></div>
<div class="card"><h2>Auto-entrepreneur</h2><div class="g">
<label>Nom<input data-k="seller.name" autocomplete="off"></label>
<label>Adresse<textarea data-k="seller.addr"></textarea></label>
<label>Téléphone<input data-k="seller.tel" inputmode="tel"></label>
<label>NIF / RC / NIS / AI<input data-k="seller.fisc"></label></div></div>
<div class="card"><h2>Client</h2><div class="g">
<label>Nom<input data-k="client.name"></label>
<label>Adresse<textarea data-k="client.addr"></textarea></label></div></div>
<div class="card"><h2>Facture</h2><div class="g g2">
<label>N°<input data-k="no"></label>
<label>Date<input type="date" data-k="date"></label>
</div></div>
<div class="card"><h2>Articles</h2><div id="items"></div><button class="sec" id="add" style="margin-top:8px">+ Ajouter un article</button></div>
<div class="card"><label>Notes<textarea data-k="notes" placeholder="Conditions de paiement, délai de livraison…"></textarea></label></div>
<div class="card tot"><div class="r"><span>Total</span><b id="tTTC"></b></div></div>
<button class="btn" id="prev">Aperçu de la facture</button>
<button class="sec" id="saveb">Enregistrer la facture</button>
<button class="sec" id="hist">Mes factures</button>
<button class="sec" id="new">Nouvelle facture</button>
<div class="m" id="emsg" style="text-align:center;min-height:22px"></div>
</section>
<section id="view" hidden class="app" style="padding:0">
<button class="sec" id="back">← Modifier</button>
<div class="sheetbox" id="box"><div id="wrap"></div></div>
<button class="btn" id="pdf">Enregistrer en PDF</button>
<div class="r" style="gap:10px"><button class="sec" id="copy">Copier le texte</button><button class="sec" id="share">Partager</button></div>
<div class="m" id="msg" style="text-align:center;min-height:22px"></div>
</section>
<section id="list" hidden class="app" style="padding:0"><h1>Mes factures</h1><button class="sec" id="lback">← Retour</button><div id="lc"></div></section>
</div>
<script>
var KEY="proforma_v1",st={n:1,D:null},D,dl=null;
try{var raw=localStorage.getItem(KEY);if(raw)st=JSON.parse(raw)}catch(e){}
function today(){var d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function mkno(n){return"PF-"+new Date().getFullYear()+"-"+("00"+n).slice(-3)}
function fresh(keep){return{id:Date.now()+Math.floor(Math.random()*1000),seller:keep?keep.seller:{name:"",addr:"",tel:"",fisc:""},client:{name:"",addr:""},no:mkno(st.n),date:today(),valid:15,tva:19,items:[{d:"",q:1,p:0}],notes:""}}
D=st.D||fresh();
function save(){st.D=D;if(D.id&&st.list){var i=st.list.findIndex(function(x){return x.id===D.id});if(i>=0)st.list[i]=JSON.parse(JSON.stringify(D))}try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]}).replace(/\n/g,"<br>")}
function m(n){var s=(Math.round(n*100)/100).toFixed(2).split(".");return s[0].replace(/\B(?=(\d{3})+(?!\d))/g,"\u00A0")+","+s[1]}
function dt(s){var p=(s||"").split("-");return p.length===3?p[2]+"/"+p[1]+"/"+p[0]:""}
function calc(){var ht=D.items.reduce(function(a,x){return a+(+x.q||0)*(+x.p||0)},0),t=ht*(+D.tva||0)/100;return{ht:ht,tva:t,ttc:ht+t}}
function get(k){var p=k.split("."),o=D;for(var i=0;i<p.length-1;i++)o=o[p[i]];return[o,p[p.length-1]]}
document.querySelectorAll("[data-k]").forEach(function(e){var r=get(e.dataset.k);e.value=r[0][r[1]];e.oninput=function(){var r=get(e.dataset.k);r[0][r[1]]=e.type==="number"?(e.value===""?"":+e.value):e.value;tot();save()}});
function tot(){var c=calc();$("tTTC").textContent=m(c.ht)+" DA"}
function items(){$("items").innerHTML=D.items.map(function(x,i){return'<div class="it"><label>Désignation<input data-i="'+i+'" data-f="d" value="'+esc(x.d).replace(/<br>/g," ")+'"></label><div class="g g2"><label>Qté<input type="number" inputmode="decimal" data-i="'+i+'" data-f="q" value="'+x.q+'"></label><label>P.U.<input type="number" inputmode="decimal" data-i="'+i+'" data-f="p" value="'+x.p+'"></label></div>'+(D.items.length>1?'<button class="x" data-rm="'+i+'" aria-label="Supprimer">✕ Supprimer</button>':'')+'</div>'}).join("");
 document.querySelectorAll("[data-i]").forEach(function(e){e.oninput=function(){var x=D.items[e.dataset.i];x[e.dataset.f]=e.dataset.f==="d"?e.value:(e.value===""?"":+e.value);tot();save()}});
 document.querySelectorAll("[data-rm]").forEach(function(b){b.onclick=function(){D.items.splice(b.dataset.rm,1);items();tot();save()}})}
$("add").onclick=function(){D.items.push({d:"",q:1,p:0});items();save()};

var U=["zéro","un","deux","trois","quatre","cinq","six","sept","huit","neuf","dix","onze","douze","treize","quatorze","quinze","seize","dix-sept","dix-huit","dix-neuf"],TT=["","","vingt","trente","quarante","cinquante","soixante"];
function b100(n,f){if(n<20)return U[n];var t=Math.floor(n/10),u=n%10;if(t<7)return TT[t]+(u===1?" et un":u?"-"+U[u]:"");if(t===7)return"soixante"+(u===1?" et onze":"-"+U[10+u]);if(t===8)return u?"quatre-vingt-"+U[u]:"quatre-vingt"+(f?"s":"");return"quatre-vingt-"+U[10+u]}
function b1000(n,f){var c=Math.floor(n/100),r=n%100,s="";if(c)s=(c>1?U[c]+" ":"")+"cent"+(c>1&&!r&&f?"s":"");if(r)s+=(s?" ":"")+b100(r,f);return s}
function nw(n){if(!n)return"zéro";var s="",mi=Math.floor(n/1e6),k=Math.floor(n%1e6/1000),r=n%1000;if(mi)s+=mi===1?"un million":b1000(mi,true)+" millions";if(k)s+=(s?" ":"")+(k===1?"mille":b1000(k,false)+" mille");if(r)s+=(s?" ":"")+b1000(r,true);return s}
function wtxt(){var t=Math.round(calc().ht*100)/100;if(!(t>0)||t>=1e9)return"";var i=Math.floor(t),c=Math.round((t-i)*100);return"Arrêtée la présente facture à la somme de : "+nw(i)+" dinars algériens"+(c?" et "+nw(c)+" centimes":"")}
function words(){var w=wtxt();return w?'<div style="margin-top:16px;font-size:13px;font-style:italic">'+esc(w)+'</div>':''}
function sheet(){var c=calc(),th='padding:8px;border:1px solid #bbb;background:#EEF1F7;font-size:12px;line-height:1.3',td='padding:8px;border:1px solid #ccc;font-size:13px;vertical-align:top',bx='border:1px solid #ccc;padding:10px;font-size:13px;line-height:1.5;min-height:90px';
 var rows=D.items.map(function(x,i){var q=+x.q||0,p=+x.p||0;return'<tr><td style="'+td+'">'+esc(x.d)+'</td><td style="'+td+';text-align:center">'+q+'</td><td style="'+td+';text-align:right">'+m(p)+'</td><td style="'+td+';text-align:right">'+m(q*p)+'</td></tr>'}).join("");
 var tr=function(a,b,v,s){return'<tr><td style="padding:6px 8px;font-size:13px;'+(s||"")+'">'+a+'</td><td style="padding:6px 8px;text-align:right;font-size:13px;white-space:nowrap;'+(s||"")+'">'+v+' DA</td></tr>'};
 return'<div id="sheet" style="width:794px;min-height:1000px;background:#fff;color:#111;padding:48px;font-family:Tajawal,Arial,sans-serif;direction:ltr;text-align:left">'+

function text(){var c=calc(),t="survinet\nFACTURE PROFORMA\nN° "+D.no+" — "+dt(D.date)+"\n\n"+D.seller.name+"\n"+D.seller.addr+"\n"+(D.seller.tel||"")+"\n\nClient : "+D.client.name+"\n\n";

 return t+"\nTotal : "+m(c.ht)+" DA"+(wtxt()?"\n"+wtxt():"")+(D.notes?"\n\n"+D.notes:"")}
function fit(){var w=Math.min(window.innerWidth-32,520),z=w/794;$("wrap").style.transform="scale("+z+")";$("box").style.width=w+"px";$("box").style.height=($("wrap").offsetHeight*z)+"px"}
function show(v){$("list").hidden=true;$("edit").hidden=v;$("view").hidden=!v;if(v){$("wrap").innerHTML=sheet();$("msg").textContent="";fit()}window.scrollTo(0,0)}
$("prev").onclick=function(){show(true)};$("back").onclick=function(){show(false)};window.addEventListener("resize",function(){if(!$("view").hidden)fit()});
$("copy").onclick=function(){try{navigator.clipboard.writeText(text()).then(function(){$("msg").textContent="Copié ✓ Collez-le dans WhatsApp ou une autre appli"},function(){$("msg").textContent="Échec de la copie"})}catch(e){$("msg").textContent="Échec de la copie"}};
$("share").onclick=function(){if(window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.Share){Capacitor.Plugins.Share.share({title:"Facture proforma "+D.no,text:text()}).catch(function(){})}else if(navigator.share){navigator.share({title:"Facture proforma "+D.no,text:text()}).catch(function(){})}else{$("msg").textContent="Partage indisponible ici, utilisez « Copier le texte »"}};
async function savePdf(name,pdf){var P=window.Capacitor&&Capacitor.Plugins;
 if(P&&P.Filesystem&&P.Share){var b64=pdf.output("datauristring").split(",")[1];var r=await P.Filesystem.writeFile({path:name,data:b64,directory:"CACHE"});await P.Share.share({title:name,url:r.uri,dialogTitle:"Envoyer la facture"})}
 else{pdf.save(name)}}
$("pdf").onclick=async function(){var msg=$("msg");
 if(!window.html2canvas||!window.jspdf){msg.textContent="Outil PDF non chargé, vérifiez la connexion";return}
 msg.textContent="Préparation…";var host=document.createElement("div");host.style.cssText="position:absolute;left:-10000px;top:0;width:794px";host.innerHTML=sheet();document.body.appendChild(host);
 try{await document.fonts.ready;var cv=await html2canvas(host.firstChild,{scale:2,backgroundColor:"#ffffff"}),pdf=new window.jspdf.jsPDF({unit:"pt",format:"a4"}),W=595.28,H=841.89,ph=Math.floor(cv.width*H/W),y=0;
  while(y<cv.height){var h=Math.min(ph,cv.height-y),s=document.createElement("canvas");s.width=cv.width;s.height=h;s.getContext("2d").drawImage(cv,0,y,cv.width,h,0,0,cv.width,h);if(y>0)pdf.addPage();pdf.addImage(s.toDataURL("image/jpeg",0.92),"JPEG",0,0,W,h*W/cv.width);y+=ph}
  await savePdf(D.no.replace(/[^A-Za-z0-9_-]/g,"_")+".pdf",pdf);msg.textContent="Enregistré ✓"}
 catch(e){msg.textContent=(e&&e.code==="declined")?"Annulé":"Échec de la création du PDF"}finally{host.remove()}};
st.list=st.list||[];if(!D.id)D.id=Date.now();
function clone(x){return JSON.parse(JSON.stringify(x))}
function hasC(x){return !!(x.client.name||x.client.addr||x.items.some(function(i){return i.d}))}
function stash(){if(!hasC(D))return;var i=st.list.findIndex(function(x){return x.id===D.id});if(i>=0)st.list[i]=clone(D);else st.list.unshift(clone(D))}
function tt(x){return x.items.reduce(function(a,i){return a+(+i.q||0)*(+i.p||0)},0)}
function fill(){document.querySelectorAll("[data-k]").forEach(function(e){var r=get(e.dataset.k);e.value=r[0][r[1]]})}
function load(x){D=x;st.D=D;fill();items();tot();save()}
function newInv(){var nd=fresh(D);nd.seller=clone(D.seller);load(nd)}

function renderList(){var L=st.list.slice().sort(function(a,b){return b.date>a.date?1:b.date<a.date?-1:b.id-a.id});
